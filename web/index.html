<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Astro Smart Attendance</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
<style>
  :root{
    --bg:#0b1020; --card:#151b32; --line:#26304f; --ink:#e8ecf8; --dim:#8d97b8;
    --ok:#2ecc71; --late:#f5a623; --absent:#e74c3c; --accent:#5b8cff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1a2444,#0b1020 60%);
    color:var(--ink);min-height:100vh;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:22px;margin:0 0 2px;letter-spacing:-.3px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px}
  input{
    width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
    background:#0e1428;color:var(--ink);font-size:15px;margin-bottom:14px;outline:none;
  }
  input:focus{border-color:var(--accent)}
  button{
    padding:11px 18px;border-radius:10px;border:0;background:var(--accent);color:#fff;
    font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s;
  }
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.55;cursor:default}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500}
  .err{color:#ff8a80;font-size:13px;margin-top:12px;display:none}
  .hide{display:none!important}

  .login{max-width:390px;margin:9vh auto 0}
  .brand{text-align:center;margin-bottom:22px}
  .brand .mark{font-size:40px}
  .hint{color:var(--dim);font-size:12px;text-align:center;margin-top:16px;line-height:1.6}

  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .who{font-size:13px;color:var(--dim)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
  .dot.dead{background:var(--absent)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  @media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .stat b{display:block;font-size:28px;letter-spacing:-1px;line-height:1.15}
  .stat span{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
  .s-ok b{color:var(--ok)} .s-late b{color:var(--late)}
  .s-absent b{color:var(--absent)} .s-total b{color:var(--ink)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);
     padding:0 10px 10px;font-weight:600;border-bottom:1px solid var(--line)}
  td{padding:11px 10px;border-bottom:1px solid #1c2340}
  tr:last-child td{border-bottom:0}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
  .p-present{background:rgba(46,204,113,.15);color:var(--ok)}
  .p-late{background:rgba(245,166,35,.15);color:var(--late)}
  .p-absent{background:rgba(231,76,60,.15);color:var(--absent)}
  .p-none{background:rgba(141,151,184,.13);color:var(--dim)}
  .mono{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
  .empty{padding:26px 10px;text-align:center;color:var(--dim);font-size:14px}
  .notice{padding:12px 0;border-bottom:1px solid #1c2340}
  .notice:last-child{border-bottom:0}
  .notice h3{margin:0 0 3px;font-size:14px}
  .notice p{margin:0;color:var(--dim);font-size:13px}
  .sec-title{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.7px;margin:0 0 12px}
  .mt{margin-top:18px}
</style>
</head>
<body>

<!-- ───────────────────────── LOGIN ───────────────────────── -->
<div class="wrap login" id="loginView">
  <div class="brand">
    <div class="mark">🎓</div>
    <h1>Astro Smart Attendance</h1>
    <div class="sub">Sign in with the account the school gave you</div>
  </div>

  <div class="card">
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required placeholder="principal@astro-school.test" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
      <button id="loginBtn" type="submit" style="width:100%">Sign in</button>
      <div class="err" id="loginErr"></div>
    </form>
  </div>

  <div class="hint">
    Staff: the account your school created.<br />
    Parents: the email you gave the office.
  </div>
</div>

<!-- ───────────────────────── DASHBOARD ───────────────────────── -->
<div class="wrap hide" id="appView">
  <div class="top">
    <div>
      <h1 id="schoolName">Dashboard</h1>
      <div class="sub" style="margin:0"><span class="dot" id="liveDot"></span><span id="liveText">Live</span></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="who" id="whoami"></div>
      <button class="ghost" id="refreshBtn">Refresh</button>
      <button class="ghost" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat s-total"><span>Students</span><b id="nTotal">–</b></div>
    <div class="stat s-ok"><span>Present</span><b id="nPresent">–</b></div>
    <div class="stat s-late"><span>Late</span><b id="nLate">–</b></div>
    <div class="stat s-absent"><span>Absent</span><b id="nAbsent">–</b></div>
  </div>

  <div class="card">
    <div class="sec-title" id="todayTitle">Today's attendance</div>
    <table>
      <thead>
        <tr><th>Roll</th><th>Student</th><th>Class</th><th>Status</th><th>Time</th></tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card mt">
    <div class="sec-title">Notices</div>
    <div id="notices"><div class="empty">Loading…</div></div>
  </div>
</div>

<script type="module">
/* ═══════════════════════════════════════════════════════════════
   CONFIG — this is the ONLY part you normally touch.
   Both values are public (they ship to every browser that opens
   the site). The secret that protects your data is your login.
   ═══════════════════════════════════════════════════════════════ */
const SUPABASE_URL = 'https://nrjchonjlncamfyzmfye.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5yamNob25qbG5jYW1meXptZnllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0NzUwNDUsImV4cCI6MjExMDA1MTA0NX0.MtiRrja_PYMWauT-ORzcOcdKHRAIXh3HtjyKeE5AoVM';
const TZ = 'Asia/Kolkata';
/* ═══════════════════════════════════════════════════════════════ */

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const loginView = $('loginView'), appView = $('appView');
let timer = null;

/* ---------- helpers ---------- */
const todayISO = () =>
  new Date().toLocaleDateString('en-CA', { timeZone: TZ });   // YYYY-MM-DD

const hhmm = (iso) =>
  iso ? new Date(iso).toLocaleTimeString('en-GB', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }) : '–';

function showErr(el, msg) {
  el.textContent = msg;
  el.style.display = 'block';
}
function clearErr(el) {
  el.style.display = 'none';
}

/* ---------- auth ---------- */
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('loginBtn'), err = $('loginErr');
  clearErr(err);
  btn.disabled = true;
  btn.textContent = 'Signing in…';

  const { error } = await supabase.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value,
  });

  btn.disabled = false;
  btn.textContent = 'Sign in';

  if (error) {
    showErr(err, error.message === 'Invalid login credentials'
      ? 'Wrong email or password.'
      : error.message);
    return;
  }
  await start();
});

$('logoutBtn').addEventListener('click', async () => {
  if (timer) clearInterval(timer);
  await supabase.auth.signOut();
  appView.classList.add('hide');
  loginView.classList.remove('hide');
});

$('refreshBtn').addEventListener('click', () => loadAll());

/* ---------- data ---------- */
async function loadAll() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return;

  $('whoami').textContent = user.email;

  const date = todayISO();
  $('todayTitle').textContent = `Today's attendance — ${date}`;

  const [studentsRes, attRes, noticesRes] = await Promise.all([
    supabase.from('students')
      .select('id, roll_no, full_name, classes(name, section)')
      .eq('active', true)
      .order('roll_no', { ascending: true }),
    supabase.from('attendance')
      .select('student_id, status, marked_at')
      .eq('attendance_date', date)
      .eq('session', 'daily'),
    supabase.from('notices')
      .select('title, body, priority, created_at')
      .order('created_at', { ascending: false })
      .limit(6),
  ]);

  if (studentsRes.error) {
    return renderFatal(studentsRes.error);
  }

  const students = studentsRes.data ?? [];
  const attByStudent = new Map((attRes.data ?? []).map(a => [a.student_id, a]));

  /* stats */
  let present = 0, late = 0;
  for (const s of students) {
    const a = attByStudent.get(s.id);
    if (!a) continue;
    if (a.status === 'present') present++;
    else if (a.status === 'late') late++;
  }
  const marked = [...attByStudent.values()].filter(a => a.status !== 'leave').length;
  const absent = Math.max(0, students.length - marked);

  $('nTotal').textContent   = students.length;
  $('nPresent').textContent = present;
  $('nLate').textContent    = late;
  $('nAbsent').textContent  = absent;

  /* table */
  const tbody = $('rows');
  if (!students.length) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty">
      No students linked to this account's school yet.
    </td></tr>`;
  } else {
    tbody.innerHTML = students.map(s => {
      const a = attByStudent.get(s.id);
      const st = a?.status ?? null;
      const cls = s.classes ? `${s.classes.name}-${s.classes.section}` : '–';
      const pill = st
        ? `<span class="pill p-${st}">${st.replace('_', ' ')}</span>`
        : `<span class="pill p-none">not marked</span>`;
      return `<tr>
        <td class="mono">${esc(s.roll_no ?? '–')}</td>
        <td>${esc(s.full_name ?? '')}</td>
        <td class="mono">${esc(cls)}</td>
        <td>${pill}</td>
        <td class="mono">${hhmm(a?.marked_at)}</td>
      </tr>`;
    }).join('');
  }

  /* notices */
  const nd = noticesRes.data ?? [];
  $('notices').innerHTML = nd.length
    ? nd.map(n => `<div class="notice">
        <h3>${esc(n.title ?? '')}</h3>
        <p>${esc(n.body ?? '')}</p>
      </div>`).join('')
    : `<div class="empty">No notices yet.</div>`;

  /* live dot */
  $('liveDot').classList.remove('dead');
  $('liveText').textContent =
    `Live — ${present + late} of ${students.length} marked today`;
}

function renderFatal(error) {
  // RLS returns an empty set rather than an error, so an error here is unusual.
  // The common "signed in but sees nothing" case is a missing members row.
  $('liveDot').classList.add('dead');
  $('liveText').textContent = 'Could not load data';
  $('rows').innerHTML = `<tr><td colspan="5" class="empty">
    ${esc(error.message)}
  </td></tr>`;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- boot ---------- */
async function start() {
  loginView.classList.add('hide');
  appView.classList.remove('hide');
  await loadAll();
  if (timer) clearInterval(timer);
  timer = setInterval(loadAll, 10000);   // auto-refresh every 10 s
}

const { data: { session } } = await supabase.auth.getSession();
if (session) start();
</script>
</body>
</html>
