<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="description" content="Astro Smart Attendance — attendance, notices and messages for one school.">
  <title>Astro Smart Attendance</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231d4ed8'/><text x='16' y='22' font-size='18' font-family='system-ui' font-weight='700' text-anchor='middle' fill='white'>A</text></svg>">
</head>
<body>
  <div id="app">
    <div class="boot">
      <div class="spinner" aria-hidden="true"></div>
      <p class="muted">Loading Astro Smart Attendance…</p>
    </div>
  </div>
  <noscript>
    <p style="padding:1rem;font-family:system-ui">
      This dashboard needs JavaScript. Enable it, or use the school office's printed report.
    </p>
  </noscript>
  <script>
    // This site used to host the Firebase version of the dashboard. If that one
    // left a service worker or cache behind, it would keep serving the old files
    // forever; clear both before the module below runs.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((rs) => rs.forEach((r) => r.unregister()))
        .catch(() => {});
    }
    if (window.caches) {
      caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
