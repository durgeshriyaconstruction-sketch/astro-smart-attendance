; PlatformIO project for the gate terminal.
; Board: ESP32 DevKit V1 (a.k.a. "ESP32 Dev Module" in the Arduino IDE).
;
;   pio run                 -> compile (no board needed)
;   pio run -t upload       -> flash over USB
;   pio device monitor      -> serial log at 115200
;
; The source files sit next to this file, so src_dir is the project root.
; astro_config.h must exist before the first build (copy astro_config.example.h).

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    miguelbalboa/MFRC522 @ ^1.4.10
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.1.2
; keep the serial log readable but not noisy
build_flags = -DCORE_DEBUG_LEVEL=0
